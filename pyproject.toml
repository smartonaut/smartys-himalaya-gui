[project]
name = "smartys-himalaya-gui"
version = "0.1.0"
description = "Grafische Oberflaeche fuer himalaya — Mail-Client mit OAuth2, App-Passwoertern und Signaturen je Gruppe"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# Laeuft ohne Zusatzpakete als Web-Oberflaeche. Fuer das eigene Fenster
# empfiehlt sich pywebview (Windows: Edge WebView2, Linux: GTK/Qt).
dependencies = []
authors = [{name = "Smartys"}]
keywords = ["email", "imap", "smtp", "himalaya", "gui", "webmail"]
classifiers = [
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email :: Email Clients (MUA)",
]

[project.optional-dependencies]
fenster = ["pywebview>=5.0"]

[project.urls]
Homepage = "https://github.com/smartonaut/smartys-himalaya-gui"

[project.scripts]
smartys-himalaya-gui = "smartys_mail.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smartys_mail"]

[tool.setuptools.package-data]
smartys_mail = ["web/*"]
