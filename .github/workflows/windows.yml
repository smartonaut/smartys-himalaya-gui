name: Windows-Fassung bauen

# Baut bei jedem Tag und auf Zuruf eine .exe auf einem echten Windows-Runner.
# Cross-Compiling von Linux aus gibt es fuer PyInstaller nicht — deshalb hier.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview

      - name: Bauen
        run: python -m PyInstaller --noconfirm --clean packaging/smartys-himalaya-gui.spec

      - name: Pruefen, dass die .exe entstanden ist
        shell: pwsh
        run: |
          $exe = "dist/SmartysHimalayaGUI.exe"
          if (-not (Test-Path $exe)) { throw "Build ohne Ergebnis" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Groesse: $mb MB"

      - name: Als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: SmartysHimalayaGUI-windows
          path: dist/SmartysHimalayaGUI.exe
          if-no-files-found: error

      - name: An das Release anhaengen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartysHimalayaGUI.exe
          fail_on_unmatched_files: true
